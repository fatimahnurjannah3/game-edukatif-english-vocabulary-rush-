function loadState(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return structuredDefault();
  const data=JSON.parse(raw);
  if(!data||data.version!==1||typeof data.points!=="number")return structuredDefault();
  return {...structuredDefault(),...data,
   daily:{...DEFAULT_STATE.daily,...(data.daily||{})},
   completed:{...(data.completed||{})},
   badges:Array.isArray(data.badges)?data.badges:[],
   history:Array.isArray(data.history)?data.history:[]
  };
 }catch(e){return structuredDefault()}
}
function structuredDefault(){return JSON.parse(JSON.stringify(DEFAULT_STATE))}
function save(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  return true;
 }catch(e){
  toast("Penyimpanan penuh. Hapus riwayat atau reset data di Profil.");
  return false;
 }
}
function today(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function toast(message){
 const el=document.getElementById("toast");
 el.textContent=message;el.classList.remove("hidden");
 clearTimeout(toastId);
 toastId=setTimeout(()=>el.classList.add("hidden"),2600);
}
function sound(frequency=550,duration=.09){
 if(!state.sound)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==="suspended")audioContext.resume();
  const osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.frequency.value=frequency;osc.type="sine";
  gain.gain.setValueAtTime(.06,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
  osc.connect(gain);gain.connect(audioContext.destination);
  osc.start();osc.stop(audioContext.currentTime+duration);
 }catch(e){}
}
function award(points){
 state.points+=points;
 state.best=Math.max(state.best,state.points);
 state.level=Math.floor(state.points/100)+1;
 save();
}
function dailyReset(){
 const t=today();
 if(state.dailyDate!==t){
  state.daily={vocab:0,grammar:0,reading:0};
  state.dailyDate=t;
  save();
 }
}
function updateDaily(kind){
 dailyReset();
 if(kind==="vocab")state.daily.vocab=Math.min(5,state.daily.vocab+1);
 if(kind==="grammar")state.daily.grammar=Math.min(3,state.daily.grammar+1);
 if(kind==="reading")state.daily.reading=1;
 save();
 checkBadges();
}
function checkBadges(){
 const earned=[];
 if(state.points>=50)earned.push("Pemula Hebat");
 if(state.points>=200)earned.push("Pemburu Bintang");
 if(state.points>=500)earned.push("Jago Bahasa");
 if(state.streak>=3)earned.push("Konsisten 3 Hari");
 if(state.daily.vocab>=5&&state.daily.grammar>=3&&state.daily.reading>=1)earned.push("Misi Harian Selesai");
 earned.forEach(b=>{if(!state.badges.includes(b)){state.badges.push(b);toast("Lencana baru: "+b+" 🏅")}});
 save();
}
function recordGame(name,score){
 state.history.unshift({name,score,date:today()});
 state.history=state.history.slice(0,20);
 save();
}
function updateStreak(){
 const t=today();
 if(state.lastDay===t)return;
 const previous=new Date(Date.now()-DAY);
 const p=previous.getFullYear()+"-"+String(previous.getMonth()+1).padStart(2,"0")+"-"+String(previous.getDate()).padStart(2,"0");
 state.streak=state.lastDay===p?state.streak+1:1;
 state.lastDay=t;
 save();
}

function setModal(html){

function speak(text){
 try{
  if(!("speechSynthesis" in window)){toast("Fitur suara tidak tersedia di browser ini.");return}
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang="en-US";utter.rate=.82;
  speechSynthesis.speak(utter);
 }catch(e){toast("Suara tidak dapat diputar di perangkat ini.")}
}

 },1000);

 return `<div class="quiz-top"><span class="pill">📖 ${s.title}</span><span class="pill">Pertanyaan ${gameData.index+1}/3</span></div>
 ${progressHTML(gameData.index,3)}
 ${gameData.index===0?`<div class="reading">${s.text}</div><div class="actions"><button class="btn btn-light" id="speakStory">🔊 Dengarkan Cerita</button></div>`:""}
 <h2 class="question">${q.q}</h2>
 <div class="options">${q.a.map((x,i)=>`<button class="option" data-answer="${i}">${x}</button>`).join("")}</div>
 <div id="explain"></div>`;
}
function initBuilder(){
 gameData.round=0;gameData.builderType="word";gameData.selected=[];
 gameData.wordQuestions=shuffle(WORDS).slice(0,4);
 gameData.sentenceQuestions=shuffle(SENTENCES).slice(0,3);
 builderQuestion();
}
function builderQuestion(){
 gameData.selected=[];
 gameData.stage="playing";
 if(gameData.round>=7){finishGame();return}
 gameData.builderType=gameData.round<4?"word":"sentence";
 const q=gameData.builderType==="word"?gameData.wordQuestions[gameData.round]:gameData.sentenceQuestions[gameData.round-4];
 gameData.current=q;
 gameData.letters=shuffle(gameData.builderType==="word"?q.word.split(""):q.scramble.map((w,i)=>({w,i})));
 render();
}
function builderHTML(){
 const word=gameData.builderType==="word";
 const q=gameData.current;
 return `<div class="quiz-top"><span class="pill">🔤 ${word?"Susun huruf":"Susun kalimat"}</span><span class="pill">${gameData.round+1}/7</span></div>
 ${progressHTML(gameData.round,7)}
 <h2 class="question">${word?"Tebak kata dari petunjuk":"Susun kata menjadi kalimat"}</h2>
 <div class="notice" style="text-align:center">${word?q.hint:"Susun kata-kata berikut agar menjadi kalimat yang benar."}</div>
 <div class="word-row">${gameData.selected.map((x,i)=>`<button class="word-chip" data-word="${i}">${typeof x==="string"?x:x.w}</button>`).join("")||"<span class='subtext'>Pilihanmu akan muncul di sini.</span>"}</div>
 <div class="letter-row">${gameData.letters.map((x,i)=>`<button class="letter" data-letter="${i}" ${gameData.selected.includes(x)?"disabled":""}>${typeof x==="string"?x:x.w}</button>`).join("")}</div>
 <div id="explain"></div>
 <div class="actions"><button class="btn btn-blue" id="checkBuild">Periksa Jawaban</button><button class="btn btn-light" id="clearBuild">Ulangi Susunan</button></div>`;
}
function selectLetter(index){
 const x=gameData.letters[index];
 if(gameData.selected.includes(x))return;
 gameData.selected.push(x);sound(650);
 render();
}
function selectWord(index){
 gameData.selected.splice(index,1);render();
}
function checkBuilder(){
 const word=gameData.builderType==="word";
 const answer=word?gameData.current.word:gameData.current.answer.join(" ");
 const attempt=gameData.selected.map(x=>typeof x==="string"?x:x.w).join(word?"":" ");
 if(!gameData.selected.length){toast("Pilih huruf atau kata terlebih dahulu.");return}
 if(attempt.toLowerCase()===answer.toLowerCase()){
  gameData.score+=15;gameData.correct++;sound(780);
  const meaning=word?gameData.current.meaning:gameData.current.meaning;
  document.getElementById("explain").innerHTML=`<div class="feedback good">Benar! 🎉 ${escapeHTML(answer)}<br><small>${escapeHTML(meaning)}</small></div><button class="btn btn-green" id="nextRound">Lanjut →</button>`;
 }else{
  gameData.wrong++;sound(180);
  document.getElementById("explain").innerHTML=`<div class="feedback bad">Belum tepat. Coba susun kembali huruf atau katanya.</div>`;
 }
 const check=document.getElementById("checkBuild");
 if(check)check.disabled=true;
}
function nextBuilderRound(){gameData.round++;builderQuestion()}

/* =========================================
   JAWABAN DAN HASIL
========================================= */
function answer(index){
 if(gameData.locked)return;
 const q=mode==="vocab"?gameData.currentOptions[index]:
  mode==="grammar"?gameData.current:
  mode==="reading"?gameData.story.questions[gameData.index]:null;
 if(!q)return;
 gameData.locked=true;
 const correct=mode==="vocab"?gameData.currentOptions[index].word===gameData.questions[gameData.index].word:index===q.correct;
 const buttons=[...document.querySelectorAll("[data-answer]")];
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q.correct||mode==="vocab"&&gameData.currentOptions[i].word===gameData.questions[gameData.index].word)b.classList.add("correct");
  if(i===index&&!correct)b.classList.add("wrong");
 });
 if(correct){
  gameData.correct++;gameData.score+=10;gameData.locked=false;
  sound(760);navigator.vibrate?.(30);
  if(mode==="daily")dailyQuestionCorrect();
 }else{
  gameData.wrong++;sound(180);
  if(mode==="vocab"||mode==="grammar")gameData.hearts--;
 }
 const feedback=document.getElementById("explain");
 if(mode==="vocab"){
  if(correct)feedback.innerHTML=`<div class="feedback good">Benar! ${gameData.questions[gameData.index].word} = ${gameData.questions[gameData.index].meaning} 🎉</div>`;
  else feedback.innerHTML=`<div class="feedback bad">Belum tepat. Jawaban: ${gameData.questions[gameData.index].word}.</div>`;
  stopTimer();
  setTimeout(()=>{gameData.index++;gameData.locked=false;vocabQuestion()},correct?750:1000);
 }else if(mode==="grammar"){
  feedback.innerHTML=`<div class="feedback ${correct?"good":"bad"}">${correct?"Serangan berhasil! ⚔️":"Serangan gagal! ❤️"}<br>${escapeHTML(q.why)}</div><button class="btn btn-blue" id="grammarNext">Lanjutkan Pertarungan →</button>`;
  document.getElementById("grammarNext").onclick=()=>{gameData.index++;gameData.locked=false;grammarQuestion()};
 }else if(mode==="reading"){
  feedback.innerHTML=`<div class="feedback ${correct?"good":"bad"}">${correct?"Jawaban benar! ⭐":"Belum tepat."}<br>${escapeHTML(q.why)}</div><button class="btn btn-blue" id="readingNext">Pertanyaan Berikutnya →</button>`;
  document.getElementById("readingNext").onclick=()=>{
   gameData.index++;gameData.locked=false;
   if(gameData.index>=3)finishGame();else render();
  };
 }
 if(mode==="daily")showDailyFeedback(correct,q);
}
function finishGame(){
 stopTimer();
 gameData.stage="result";
 const base=gameData.score||gameData.correct*10;
 const bonus=gameData.correct>=5?10:0;
 const earned=base+bonus;
 gameData.finalScore=earned;
 award(earned);
 const label={vocab:"Vocabulary Rush",grammar:"Grammar Quest",reading:"Reading Adventure",builder:"Word Builder",daily:"Daily Challenge"}[mode];
 recordGame(label,earned);
 if(gameData.correct>0)updateStreak();
 if(mode==="vocab")updateDaily("vocab");
 if(mode==="grammar")updateDaily("grammar");
 if(mode==="reading")updateDaily("reading");
 checkBadges();render();
}
function resultHTML(){
 const win=gameData.correct>0;
 return `<div class="content-panel" style="text-align:center">
 <div style="font-size:76px">${win?"🏆":"💪"}</div>
 <div class="eyebrow" style="color:var(--blue)">HASIL PETUALANGAN</div>
 <h2 class="page-title">${win?"Kerja bagus!":"Tetap semangat!"}</h2>
 <p class="subtext">${win?"Kamu sudah menyelesaikan latihan. Terus berlatih agar semakin mahir.":"Jangan menyerah. Coba lagi dan pelajari jawabannya."}</p>
 <div class="stats">
 <div class="stat"><strong>${gameData.finalScore||0}</strong><span>Poin didapat</span></div>
 <div class="stat"><strong>${gameData.correct}</strong><span>Jawaban benar</span></div>
 <div class="stat"><strong>${gameData.wrong}</strong><span>Jawaban salah</span></div>
 <div class="stat"><strong>${state.level}</strong><span>Level sekarang</span></div>
 </div>
 <div class="actions" style="justify-content:center">
 <button class="btn btn-blue" id="retryGame">Main Lagi</button>
 <button class="btn btn-light" id="exitGame">Kembali ke Menu</button>
 </div></div>`;
}

/* =========================================
   TANTANGAN HARIAN
========================================= */
function initDaily(){
 dailyReset();
 gameData.dailyStage="vocab";
 gameData.dailyCount=0;
 gameData.score=0;gameData.correct=0;gameData.wrong=0;
 gameData.questions=shuffle(vocabPool()).slice(0,5);
 gameData.index=0;
 dailyQuestion();
}
function dailyHTML(){
 if(gameData.dailyStage==="vocab"){
  const q=gameData.questions[gameData.index];
  return `<div class="quiz-top"><span class="pill">🌟 Misi 1: Vocabulary</span><span class="pill">${gameData.index+1}/5</span></div>
  ${progressHTML(gameData.index,5)}<div class="question-visual">${q.emoji}</div>
  <h2 class="question">Pilih kata yang tepat</h2>
  <div class="options">${gameData.currentOptions.map((x,i)=>`<button class="option" data-answer="${i}">${x.word}</button>`).join("")}</div><div id="explain"></div>`;
 }
 if(gameData.dailyStage==="grammar"){
  const q=gameData.current;
  return `<div class="quiz-top"><span class="pill">🌟 Misi 2: Grammar</span><span class="pill">${gameData.index+1}/3</span></div>
  ${progressHTML(gameData.index,3)}<h2 class="question">${q.q}</h2>
  <div class="options">${q.a.map((x,i)=>`<button class="option" data-answer="${i}">${x}</button>`).join("")}</div><div id="explain"></div>`;
 }
 if(gameData.dailyStage==="reading"){
  const s=gameData.story;const q=s.questions[gameData.index];
  return `<div class="quiz-top"><span class="pill">🌟 Misi 3: Reading</span><span class="pill">${gameData.index+1}/3</span></div>
  ${progressHTML(gameData.index,3)}
  ${gameData.index===0?`<div class="reading">${s.text}</div><button class="btn btn-light" id="speakStory">🔊 Dengarkan</button>`:""}
  <h2 class="question">${q.q}</h2>
  <div class="options">${q.a.map((x,i)=>`<button class="option" data-answer="${i}">${x}</button>`).join("")}</div><div id="explain"></div>`;
 }
 return `<div class="empty">Menyiapkan misi berikutnya...</div>`;
}
function dailyQuestion(){
 gameData.locked=false;
 if(gameData.dailyStage==="vocab"){
  if(gameData.index>=5){gameData.dailyStage="grammar";gameData.index=0;dailyGrammar();return}
  const q=gameData.questions[gameData.index];
  gameData.currentOptions=shuffle([q,...shuffle(vocabPool().filter(x=>x.word!==q.word)).slice(0,3)]);
 }else if(gameData.dailyStage==="grammar"){
  if(gameData.index>=3){gameData.dailyStage="reading";gameData.index=0;gameData.story=STORIES[Math.floor(Math.random()*STORIES.length)];render();return}
  gameData.current=shuffle(GRAMMAR)[0];
 }else if(gameData.dailyStage==="reading"){
  if(gameData.index>=3){finishDaily();return}
 }
 render();
}
function dailyGrammar(){gameData.dailyGrammar=shuffle(GRAMMAR).slice(0,3);gameData.current=gameData.dailyGrammar[0];render()}
function dailyQuestionCorrect(){gameData.dailyCount++}
function showDailyFeedback(correct,q){
 const f=document.getElementById("explain");
 if(!f)return;
 let why=mode==="daily"?(gameData.dailyStage==="vocab"?"Kosakata benar!":gameData.dailyStage==="grammar"?q.why:q.why):"";
 f.innerHTML=`<div class="feedback ${correct?"good":"bad"}">${correct?"Bagus! ⭐":"Coba ingat lagi."}<br>${escapeHTML(why)}</div><button class="btn btn-blue" id="dailyNext">Lanjut →</button>`;
}
function nextDaily(){
 gameData.index++;
 gameData.locked=false;
 if(gameData.dailyStage==="grammar"&&gameData.index<3)gameData.current=gameData.dailyGrammar[gameData.index];
 dailyQuestion();
}
function finishDaily(){
 gameData.score+=50;
 gameData.correct+=0;
 state.daily={vocab:5,grammar:3,reading:1};
 state.dailyDate=today();
 gameData.dailyStage="done";
 gameData.stage="result";
 award(gameData.score);
 recordGame("Daily Challenge",gameData.score);
 updateStreak();checkBadges();render();
}

/* =========================================
   KONTROL, ONBOARDING, DAN PEMBERSIHAN
========================================= */
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
document.getElementById("soundBtn").addEventListener("click",()=>{
 state.sound=!state.sound;save();
 document.getElementById("soundBtn").textContent=state.sound?"🔊":"🔇";
 if(state.sound)sound();
});
document.getElementById("helpBtn").addEventListener("click",showHelp);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("click",e=>{
 if(e.target.closest("[data-close]"))closeModal();
});
function showHelp(){
 setModal(`<h2 id="modalTitle">Cara bermain 📚</h2>
 <ol class="onboard-list">
 <li>Pilih permainan dari menu Belajar atau Main Game.</li>
 <li>Baca materi singkat sebelum memulai soal.</li>
 <li>Jawab pertanyaan dan kumpulkan poin serta lencana.</li>
 <li>Selesaikan misi harian untuk membangun streak.</li>
 <li>Progres akan tersimpan otomatis di perangkatmu.</li>
 </ol>
 <p class="notice">Tips: gunakan tombol 🔊 untuk mendengarkan cerita Bahasa Inggris pada Reading Adventure.</p>
 <button class="btn btn-blue" data-close>Siap, mengerti!</button>`);
}
function showOnboarding(){
 if(state.onboarded)return;
 setModal(`<h2 id="modalTitle">Selamat datang di English Quest! ⭐</h2>
 <p>Di sini kamu bisa belajar Bahasa Inggris melalui lima permainan.</p>
 <ol class="onboard-list">
 <li>📚 Pelajari materi singkat terlebih dahulu.</li>
 <li>🎮 Jawab soal untuk mengumpulkan bintang.</li>
 <li>🏆 Selesaikan misi harian dan kumpulkan lencana.</li>
 </ol>
 <button class="btn btn-blue" id="startOnboarding">Ayo Mulai!</button>
 <button class="btn btn-light" id="skipOnboarding">Lewati</button>`);
 document.getElementById("startOnboarding").onclick=finishOnboarding;
 document.getElementById("skipOnboarding").onclick=finishOnboarding;
}
function finishOnboarding(){
 state.onboarded=true;save();closeModal();toast("Selamat belajar, "+state.name+"! ⭐");
}
function globalRender(){
 render();
 document.getElementById("soundBtn").textContent=state.sound?"🔊":"🔇";
}
function render(){
 const app=document.getElementById("app");
 if(page==="home")app.innerHTML=homeHTML();
 else if(page==="learn")app.innerHTML=learnHTML();
 else if(page==="games")app.innerHTML=gamesHTML();
 else if(page==="ranking")app.innerHTML=rankingHTML();
 else if(page==="profile")app.innerHTML=profileHTML();
 else if(page==="play")app.innerHTML=playHTML();
 else app.innerHTML=homeHTML();
 bindPage();
 if(page==="play")bindPlay();
}
function startGame(id){
 stopTimer();
 mode=id;gameData={
 score:0,correct:0,wrong:0,index:0,answers:[],time:10,
 round:0,selected:[],stage:"lesson",locked:false
 };
 page="play";
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",false));
 render();window.scrollTo(0,0);
}
function beginMode(){
 gameData.stage="playing";
 if(mode==="vocab")initVocab();
 else if(mode==="grammar")initGrammar();
 else if(mode==="reading")initReading();
 else if(mode==="builder")initBuilder();
 else if(mode==="daily")initDaily();
}
function cleanup(){
 stopTimer();
 if(window.speechSynthesis)window.speechSynthesis.cancel();
}
window.addEventListener("blur",()=>{
 if(mode&&gameData&&gameData.stage==="playing"&&mode==="vocab"){
  stopTimer();toast("Waktu dihentikan sementara. Kembali ke permainan untuk melanjutkan.");
 }
});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  stopTimer();
  if(window.speechSynthesis)speechSynthesis.cancel();
 }else if(mode&&gameData&&gameData.stage==="playing"&&mode==="vocab"){
  vocabQuestion();
 }
});
window.addEventListener("pagehide",cleanup);
window.addEventListener("beforeunload",cleanup);

/* Penanganan tombol kembali Android */
try{
 history.pushState({englishQuest:true},"","#english-quest");
 window.addEventListener("popstate",()=>{
  if(!document.getElementById("modal").classList.contains("hidden"))closeModal();
  else if(page==="play"){cleanup();setPage("games")}
  else if(page!=="home")setPage("home");
  history.pushState({englishQuest:true},"","#english-quest");
 });
}catch(e){}

/* Pemulihan tampilan ketika ukuran viewport berubah */
let resizeTimeout=null;
function handleResize(){
 clearTimeout(resizeTimeout);
 resizeTimeout=setTimeout(()=>{
  const panel=document.querySelector(".content-panel");
  if(panel)panel.style.maxWidth="100%";
 },180);
}
window.addEventListener("resize",handleResize);
if(window.visualViewport)window.visualViewport.addEventListener("resize",handleResize);

/* Inisialisasi */
try{
 dailyReset();
 render();
 document.getElementById("soundBtn").textContent=state.sound?"🔊":"🔇";
 showOnboarding();
}catch(e){
 document.getElementById("app").innerHTML=
 `<div class="content-panel"><h2>Permainan belum dapat dibuka</h2>
 <p>Terjadi kesalahan saat menyiapkan permainan. Muat ulang halaman. Jika masalah berlanjut, hapus data permainan melalui pengaturan browser.</p>
 <button class="btn btn-blue" onclick="location.reload()">Muat Ulang</button></div>`;
}
</script>
</body>
</html>
